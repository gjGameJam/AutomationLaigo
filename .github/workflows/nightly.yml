name: LAIGO Nightly API Tests

on:
  schedule:
    # 2 AM Eastern = 6 AM UTC (adjusted for EST/EDT automatically)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override LAIGO base URL (leave blank to use secret)'
        required: false
        type: string

jobs:
  api-tests:
    name: API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LAIGO_BASE_URL: ${{ inputs.base_url || secrets.LAIGO_BASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Diagnostic breadcrumb only — never prints the secret value. When the
      # secret/input is absent, GH still exports LAIGO_BASE_URL as "", and the
      # test config falls back to the appsettings.test.json default.
      - name: Report base URL source
        run: |
          if [ -n "$LAIGO_BASE_URL" ]; then
            echo "LAIGO_BASE_URL override is set (from input or secret)"
          else
            echo "LAIGO_BASE_URL is empty — falling back to appsettings.test.json default"
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AutomationLaigo.sln

      - name: Build
        run: dotnet build AutomationLaigo.sln --no-restore --configuration Release

      # Gating run — excludes the KnownFailing quarantine so a green result
      # genuinely means green. The quarantined LEGO canary is a deliberate,
      # tracked failure (backend GraphQL migration pending); keeping it out of
      # the gate prevents alert fatigue from a permanently-red suite.
      - name: Run API tests (gating)
        run: >
          dotnet test AutomationLaigo.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "Category!=KnownFailing"
          --logger "trx;LogFilePath=nightly-results.trx"
          --results-directory ./TestResults

      # Non-gating run — surfaces the quarantined canary so we notice the moment
      # LEGO sourcing is restored. [Explicit] tests only run when explicitly
      # selected, so we target the category directly. Never fails the build.
      - name: Run quarantine (non-gating)
        if: always()
        continue-on-error: true
        run: >
          dotnet test AutomationLaigo.sln
          --no-build
          --configuration Release
          --verbosity normal
          --filter "Category=KnownFailing"
          --logger "trx;LogFilePath=quarantine-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::LAIGO nightly tests FAILED. Check the uploaded test results artifact."
